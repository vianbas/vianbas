name: Refresh Profile README

on:
  schedule:
    # Daily 06:30 UTC — keep the facts badges and contribution cards fresh.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-readme
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh profile data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate GitHub facts badges
        run: node scripts/refresh-profile-facts.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate contribution scan cards
        run: node scripts/generate-contrib-svg.mjs
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: assets

      - name: Commit and push if changed
        id: commit
        run: |
          # Stage everything first so newly-generated (untracked) SVG cards
          # are included — `git diff` alone misses untracked files.
          git add -A
          if git diff --cached --quiet; then
            echo "No facts changed — nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh profile README"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
