name: Refresh Profile README

on:
  schedule:
    # Daily 06:30 UTC — keep the README facts table and stats cards fresh.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-readme
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh profile data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate GitHub facts table
        run: node scripts/refresh-profile-facts.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=vianbas&show_icons=true&hide_rank=true&bg_color=0D1117
          path: assets/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=vianbas&show_icons=true&hide_rank=true&bg_color=ffffff
          path: assets/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=vianbas&layout=compact&langs_count=6&bg_color=0D1117
          path: assets/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=vianbas&layout=compact&langs_count=6&bg_color=ffffff
          path: assets/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- README.md assets/; then
            echo "No facts changed — nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md assets/
            git commit -m "chore: refresh profile README"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
